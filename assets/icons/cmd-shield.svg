  <path d="M8.4 11.1h7.2" stroke="#5E35B1" stroke-width="2.1" stroke-linecap="round"/>
  <path d="M8.4 14.5h4.6" stroke="#5E35B1" stroke-width="2.1" stroke-linecap="round" opacity="0.5"/>
</svg>
