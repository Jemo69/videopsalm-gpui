    <path d="M12 3.1v17.8"/>
    <path d="m4.22 7.55 15.56 9"/>
    <path d="M19.78 7.55 4.22 16.55"/>
  </g>
  <g stroke="#00ACC1" stroke-width="1.6" stroke-linecap="round" opacity="0.8">
    <path d="M12 6.9 9.9 4.8M12 6.9l2.1-2.1"/>
    <path d="M12 17.1 9.9 19.2M12 17.1l2.1 2.1"/>
