<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data: blob:; media-src 'self' file: data: blob:; font-src 'self' file: data:;" />
<title>VideoPsalm — Stage view</title>
<link rel="stylesheet" href="styles.css" />
<style>
  #stage-alert { background: #b00020; color: #fff; padding: 0.5em 1em; border-radius: 6px; margin-top: 0.6em; }
  body { padding: 1em; font-family: sans-serif; background: #121212; color: #eee; }
  .stage-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.8em; }
  .stage-toggle { background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px; padding: 0.3em 0.8em; cursor: pointer; font-size: 0.85em; }
  .stage-toggle.active { background: #f97327; border-color: #f97327; font-weight: bold; }
  .whole-song-box { display: flex; flex-direction: column; gap: 0.8em; max-height: 70vh; overflow-y: auto; padding: 0.5em; border: 1px solid #333; border-radius: 6px; }
  .whole-song-verse { padding: 0.5em; border-radius: 4px; background: #1c1c1c; border-left: 3px solid transparent; white-space: pre-wrap; font-size: 1.1em; }
  .whole-song-verse.live { background: #2a5db0; color: #fff; border-left-color: #7fb3ff; font-weight: bold; }
</style>
</head>
<body data-theme="dark">
<div class="stage-bar">
  <h2>Stage view <span class="hint">(current + next + clock + alert)</span></h2>
  <button id="stage-toggle-whole" class="stage-toggle" type="button">Whole song</button>
</div>
<div id="stage-split-view" class="cols">
  <div><h3>Current</h3><div id="stage-current" class="preview"></div></div>
  <div><h3>Next</h3><div id="stage-next" class="preview"></div></div>
</div>
<div id="stage-whole-view" class="whole-song-box" hidden></div>
<h3 id="stage-clock">--:--</h3>
<div id="stage-alert" hidden></div>
<script src="stage.js"></script>
</body>
</html>
