name: Build

# Tests on every push/PR. Platform packages are built on version tags
# (v*) and attached to the GitHub release; a manual dispatch can
# (re)attach them to an existing release.
on:
  push:
    branches: [ main, cleanroom-port ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach artifacts to"
        required: true
        default: "v0.1.0"

permissions:
  contents: read

env:
  TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  package-linux:
    name: Package (Linux x64)
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run package
      - run: zip -qr -1 videopsalm-linux-x64.zip videopsalm-linux-x64
        working-directory: release-pkg
      - uses: actions/upload-artifact@v4
        with:
          name: videopsalm-linux-x64
          path: release-pkg/videopsalm-linux-x64.zip

  package-win:
    name: Package (Windows x64)
    runs-on: windows-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run package:win
      - run: Compress-Archive -Path release-pkg/videopsalm-win32-x64 -DestinationPath release-pkg/videopsalm-win32-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: videopsalm-win32-x64
          path: release-pkg/videopsalm-win32-x64.zip

  release:
    name: Attach to GitHub release
    runs-on: ubuntu-latest
    needs: [package-linux, package-win]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-assets
          merge-multiple: true
      - run: ls -la dist-assets
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG_NAME" \
              --notes "Clean-room VideoPsalm 1.29 port (Electron). Offline-first worship presenter."
          fi
          gh release upload "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist-assets/*
