name: Build

# vp-core tests + app check on every push/PR. Release binaries are built
# natively per platform on version tags (v*) and attached to the GitHub
# release; a manual dispatch can (re)attach them to an existing release.
# (Windows builds run on windows-latest with stock MSVC — no cross-compile.)
on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach artifacts to"
        required: true
        default: "v0.1.0"

permissions:
  contents: read

env:
  TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p vp-core
      - run: cargo check -p videopsalm-gpui --bin videopsalm-gpui

  package-linux:
    name: Package (Linux x64)
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p videopsalm-gpui
      - run: cp target/release/videopsalm-gpui videopsalm-gpui-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: videopsalm-gpui-linux-x64
          path: videopsalm-gpui-linux-x64

  package-win:
    name: Package (Windows x64)
    runs-on: windows-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p videopsalm-gpui
      - run: Copy-Item target/release/videopsalm-gpui.exe videopsalm-gpui-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: videopsalm-gpui-windows-x64
          path: videopsalm-gpui-windows-x64.exe

  release:
    name: Attach to GitHub release
    runs-on: ubuntu-latest
    needs: [package-linux, package-win]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-assets
          merge-multiple: true
      - run: ls -la dist-assets
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG_NAME" \
              --notes "Clean-room VideoPsalm 1.29 port (Rust/GPUI). Offline-first worship presenter."
          fi
          gh release upload "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --clobber dist-assets/*
